name: Playwright PR Checks

# Hermetic Playwright tier: the pull-request gate.
#
# Runs `--project=hermetic` across two shards: the SDK and demo shop are served
# locally by Playwright's `webServer` (ports 9150/9160) and every router call is
# answered from playwright-tests/recordings/ via context.route(). No sandbox, no
# secrets, no GitHub environment, and no retries, so a red run means a real
# regression. Each shard uses four Playwright workers. The aggregate hermetic
# job preserves the required check name and succeeds only when both shards pass.
#
# The live-sandbox tier runs alongside it in playwright-live-e2e.yml.

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner image to run on"
        type: choice
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - ubuntu-26.04
          - ubuntu-24.04
          - ubuntu-22.04

# Explicit least-privilege permissions
permissions:
  contents: read

# Cancel superseded runs for the same PR. Every other run (main pushes, merge
# queue) gets a group of its own, so none of them is ever cancelled or dropped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"

jobs:
  hermetic-shards:
    name: hermetic (${{ matrix.shard }}/2)
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      REACT_HYPER_JS_PATH: ${{ github.workspace }}/.ci/react-hyper-js

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Companion PR #25 supplies the widget-ref API exercised by the React
      # integration specs. Pin its reviewed source so fork PRs need no secrets.
      - name: Checkout React wrapper
        uses: actions/checkout@v4
        with:
          repository: juspay/react-hyper-js
          ref: 723616051c362c61b3ac1c35c8c4abf76b45e8d9
          path: .ci/react-hyper-js
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            Hyperswitch-React-Demo-App/package-lock.json
            playwright-tests/package-lock.json
            .ci/react-hyper-js/package-lock.json

      - name: Update git submodules
        run: git submodule update --init --recursive

      # --ignore-scripts: the root postinstall would pull shared-code to its
      # latest main commit, overriding the pinned submodule checked out above.
      - name: Install SDK dependencies
        run: npm install --ignore-scripts

      - name: Install demo app dependencies
        working-directory: ./Hyperswitch-React-Demo-App
        run: npm install

      - name: Build React wrapper
        working-directory: ./.ci/react-hyper-js
        run: |
          npm ci
          npm run re:build
          npm run build

      # playwright.config.ts would run this itself on load when
      # src/Utilities/TestUtils.bs.js is missing; doing it here keeps the
      # compile time and any ReScript errors in their own step.
      - name: Compile ReScript
        run: npm run re:build

      - name: Install Playwright test dependencies
        working-directory: ./playwright-tests
        run: npm ci

      - name: Read Playwright version
        id: playwright-version
        working-directory: ./playwright-tests
        run: |
          version="$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # Restore and save separately so the browsers are cached even when the
      # tests fail (actions/cache only saves after a successful job).
      - name: Restore Playwright browsers
        id: browser-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-chromium

      # On a cache hit this only installs the OS dependencies.
      - name: Install Playwright Chromium
        working-directory: ./playwright-tests
        run: npx playwright install --with-deps chromium

      - name: Save Playwright browsers
        if: ${{ steps.browser-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browser-cache.outputs.cache-primary-key }}

      # CI=true: forbids test.only, adds the GitHub reporter and makes the
      # webServer entries start fresh servers instead of reusing any.
      - name: Run hermetic tests
        working-directory: ./playwright-tests
        run: npx playwright test --project=hermetic --retries=0 --shard=${{ matrix.shard }}/2

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-hermetic-${{ matrix.shard }}
          path: playwright-tests/playwright-report
          if-no-files-found: ignore
          retention-days: 14

      # Traces (trace: retain-on-failure), screenshots and error context.
      - name: Upload traces on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: traces-hermetic-${{ matrix.shard }}
          path: playwright-tests/test-results
          if-no-files-found: ignore
          retention-days: 7

  hermetic:
    name: hermetic
    if: ${{ always() }}
    needs: hermetic-shards
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Check all shards passed
        env:
          SHARD_RESULT: ${{ needs.hermetic-shards.result }}
        run: test "$SHARD_RESULT" = success
