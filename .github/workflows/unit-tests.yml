name: Unit Tests

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR checks; preserve every merge queue and main push run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
    steps:
      - name: Checkout repository and pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      # Root postinstall updates shared-code to its branch tip and installs the
      # demo. Test the committed submodule revision without those side effects.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Compile ReScript and typecheck unit tests
        run: npm run test:unit:typecheck

      - name: Compile ReScript and run unit coverage
        run: npm run test:unit:coverage

      - name: Upload unit coverage reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: coverage/unit/
          if-no-files-found: ignore
          retention-days: 7
